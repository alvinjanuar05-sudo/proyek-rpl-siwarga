name: SiWarga CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Unit Testing (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siwarga-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: siwarga-backend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Backend Unit Tests
        run: npm test

  frontend-build:
    name: Frontend Build & Typecheck (Vite + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: siwarga
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: siwarga/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Run Frontend Build
        run: npm run build

