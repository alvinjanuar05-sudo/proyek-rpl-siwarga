name: SiWarga CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci-pipeline:
    name: Automated Testing, Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            siwarga-backend/package-lock.json
            siwarga/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd siwarga-backend
          npm install

      - name: Run Backend Internal Tests
        run: |
          cd siwarga-backend
          npm test

      - name: Run Root Automated Unit & Architecture Tests
        run: npm test

      - name: Install Frontend Dependencies
        run: |
          cd siwarga
          npm install

      - name: Build & Typecheck Frontend (Vite + TypeScript)
        run: |
          cd siwarga
          npm run build
